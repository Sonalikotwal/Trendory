<!DOCTYPE html>
<html>
<head>
  <title>Amazon Style Tracking</title>

  <style>
    body {
      font-family: Arial;
      background: #f4f4f4;
      text-align: center;
      padding: 40px;
    }

    .box {
      width: 500px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h2 {
      margin-bottom: 20px;
    }

    input {
      width: 80%;
      padding: 10px;
      margin-bottom: 10px;
    }

    button {
      padding: 10px 20px;
      background: black;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 5px;
    }

    /* ================= TRACKING STEPS ================= */

    .tracker {
      display: flex;
      justify-content: space-between;
      margin-top: 40px;
      position: relative;
    }

    .tracker::before {
      content: "";
      position: absolute;
      top: 15px;
      left: 0;
      width: 100%;
      height: 4px;
      background: #ddd;
      z-index: 0;
    }

    .step {
      width: 25%;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .circle {
      width: 30px;
      height: 30px;
      background: #ddd;
      border-radius: 50%;
      margin: auto;
      line-height: 30px;
      color: white;
      transition: 0.4s;
    }

    .label {
      font-size: 12px;
      margin-top: 8px;
    }

    /* ACTIVE STEP */
    .active .circle {
      background: green;
      transform: scale(1.2);
      box-shadow: 0 0 10px green;
    }

    .active .label {
      font-weight: bold;
      color: green;
    }

    /* LINE FILL */
    .tracker-fill {
      position: absolute;
      top: 15px;
      left: 0;
      height: 4px;
      background: green;
      z-index: 0;
      transition: width 0.5s ease-in-out;
    }

    .status-text {
      margin-top: 20px;
      font-size: 20px;
      color: green;
    }

  </style>
</head>

<body>

<div class="box">
  <h2>📦 Order Tracking</h2>

  <input type="text" id="orderId" placeholder="Enter Order ID">
  <br>
  <button onclick="trackOrder()">Track Order</button>

  <div class="status-text" id="statusText">Waiting...</div>

  <div class="tracker">
    <div class="tracker-fill" id="fill"></div>

    <div class="step" id="s1">
      <div class="circle">1</div>
      <div class="label">Ordered</div>
    </div>

    <div class="step" id="s2">
      <div class="circle">2</div>
      <div class="label">Shipped</div>
    </div>

    <div class="step" id="s3">
      <div class="circle">3</div>
      <div class="label">Out for Delivery</div>
    </div>

    <div class="step" id="s4">
      <div class="circle">4</div>
      <div class="label">Delivered</div>
    </div>
  </div>
</div>

<script>

function resetUI() {
  document.querySelectorAll(".step").forEach(el => {
    el.classList.remove("active");
  });
  document.getElementById("fill").style.width = "0%";
}

function updateUI(status) {

  resetUI();

  let step = 1;

  if (status === "Order Placed") step = 1;
  if (status === "Shipped") step = 2;
  if (status === "Out for Delivery") step = 3;
  if (status === "Delivered") step = 4;

  for (let i = 1; i <= step; i++) {
    document.getElementById("s" + i).classList.add("active");
  }

  let width = (step - 1) * 33.3;
  document.getElementById("fill").style.width = width + "%";

  document.getElementById("statusText").innerText =
    "Status: " + status;
}

function trackOrder() {
  const id = document.getElementById("orderId").value;

  if (!id) {
    alert("Enter Order ID");
    return;
  }

  function fetchStatus() {
    fetch("http://localhost:5000/api/order/" + id)
      .then(res => res.json())
      .then(data => {
        updateUI(data.status);
      })
      .catch(err => {
        document.getElementById("statusText").innerText =
          "Order not found ❌";
      });
  }

  fetchStatus();
  setInterval(fetchStatus, 3000);
}

</script>

</body>
</html>
