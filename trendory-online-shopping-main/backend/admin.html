<!DOCTYPE html>
<html>
<head>
  <title>Admin Panel</title>
  <style>
    body {
      font-family: Arial;
      padding: 20px;
      background: #f4f4f4;
    }

    h1 {
      text-align: center;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background: white;
    }

    th, td {
      padding: 12px;
      border: 1px solid #ddd;
      text-align: center;
    }

    th {
      background: black;
      color: white;
    }

    button {
      padding: 6px 10px;
      margin: 2px;
      border: none;
      cursor: pointer;
    }

    .delete { background: red; color: white; }
    .update { background: green; color: white; }
  </style>
</head>

<body>

<h1>Admin Panel - Orders</h1>

<table>
  <thead>
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Phone</th>
      <th>Address</th>
      <th>Status</th>
      <th>Action</th>
    </tr>
  </thead>

  <tbody id="orderTable"></tbody>
</table>

<script>

// ================= LOAD ORDERS =================
function loadOrders() {
  fetch("http://localhost:5000/api/orders")
    .then(res => res.json())
    .then(data => {

      let html = "";

      data.forEach(order => {
        html += `
          <tr>
            <td>${order._id}</td>
            <td>${order.customerName}</td>
            <td>${order.phone}</td>
            <td>${order.address}</td>
            <td>${order.status}</td>
            <td>
              <button class="update" onclick="updateStatus('${order._id}')">Update</button>
              <button class="delete" onclick="deleteOrder('${order._id}')">Delete</button>
            </td>
          </tr>
        `;
      });

      document.getElementById("orderTable").innerHTML = html;
    })
    .catch(err => {
      console.log(err);
      alert("Failed to load orders ❌");
    });
}

// ================= UPDATE STATUS =================
function updateStatus(id) {
  const newStatus = prompt("Enter status: Shipped / Delivered / Cancelled");

  if (!newStatus) return;

  fetch(`http://localhost:5000/api/order/${id}`, {
    method: "PUT",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ status: newStatus })
  })
  .then(res => res.json())
  .then(data => {
    alert("Updated ✅");
    loadOrders();
  })
  .catch(err => {
    console.log(err);
    alert("Update failed ❌");
  });
}

// ================= DELETE ORDER =================
function deleteOrder(id) {
  if (!confirm("Are you sure to delete this order?")) return;

  fetch(`http://localhost:5000/api/order/${id}`, {
    method: "DELETE"
  })
  .then(res => res.json())
  .then(data => {
    alert("Deleted ✅");
    loadOrders();
  })
  .catch(err => {
    console.log(err);
    alert("Delete failed ❌");
  });
}

// INIT
loadOrders();

</script>

</body>
</html>
